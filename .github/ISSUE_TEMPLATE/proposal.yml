name: Proposal
about: Propose a scoped foundation, architecture, governance, or specification change
title: "[Proposal] "
labels: ["status: needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Do not post credentials, private keys, personal or pastoral records, safeguarding evidence, confidential institutional information, active exploit details, or private conflict reports here. Use the confidential routes in SECURITY.md, MODERATION.md, and INCIDENT-RESPONSE.md.
  - type: textarea
    id: problem
    attributes:
      label: Mission or user problem
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope and exclusions
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies, prior decisions, and requested interim steward
      description: Link related issues/RFCs/ADRs and name the maintainer or working-group steward requested to coordinate review.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria and evidence
    validations:
      required: true
  - type: textarea
    id: risk
    attributes:
      label: Security, privacy, safeguarding, compatibility, financial, authority, representation, IPR, and data implications
    validations:
      required: true
  - type: dropdown
    id: agent
    attributes:
      label: AI-agent suitability
      options:
        - Human-only accountable decision
        - Agent-assisted with human review
        - Suitable for a supervised agent
    validations:
      required: true
  - type: textarea
    id: disclosure
    attributes:
      label: AI-agent involvement
      description: Identify the agent; accountable individual or organization sponsor; operator/controller when different; material models, tools, and external providers; provenance and evidence; human reviewers/checkpoints; and requested permissions and reward beneficiary where relevant. State "None" if no agent was involved. Do not expose confidential operational details.
    validations:
      required: true
