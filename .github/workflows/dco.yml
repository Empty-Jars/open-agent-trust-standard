name: DCO

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: dco-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  signoff:
    name: DCO sign-off
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify every pull-request commit has a DCO sign-off
        env:
          API_URL: ${{ github.api_url }}
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PULL_REQUEST_NUMBER: ${{ github.event.pull_request.number }}
          EXPECTED_COMMIT_COUNT: ${{ github.event.pull_request.commits }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import sys
          import urllib.request

          api_url = os.environ["API_URL"].rstrip("/")
          repository = os.environ["REPOSITORY"]
          pull_number = os.environ["PULL_REQUEST_NUMBER"]
          expected_count = int(os.environ["EXPECTED_COMMIT_COUNT"])
          token = os.environ["GH_TOKEN"]
          signoff = re.compile(r"Signed-off-by:\s+.+\s+<[^<>\s]+@[^<>\s]+>", re.IGNORECASE)
          trailer = re.compile(r"[A-Za-z0-9-]+:\s+.+")
          commits = []

          def terminal_trailers(message):
              lines = message.rstrip().splitlines()
              separators = [index for index, line in enumerate(lines) if not line.strip()]
              if not separators:
                  return []
              block = lines[separators[-1] + 1 :]
              if not block:
                  return []
              parsed = []
              for line in block:
                  if trailer.fullmatch(line):
                      parsed.append(line)
                  elif line.startswith((" ", "\t")) and parsed:
                      continue
                  else:
                      return []
              return parsed

          if expected_count < 1:
              print("The pull request contains no commits.", file=sys.stderr)
              sys.exit(1)
          if expected_count > 250:
              print(
                  "The pull request contains more than GitHub's 250-commit API limit. "
                  "Split it into smaller pull requests so every commit can be verified.",
                  file=sys.stderr,
              )
              sys.exit(1)

          for page in range(1, 4):
              url = f"{api_url}/repos/{repository}/pulls/{pull_number}/commits?per_page=100&page={page}"
              request = urllib.request.Request(
                  url,
                  headers={
                      "Accept": "application/vnd.github+json",
                      "Authorization": f"Bearer {token}",
                      "X-GitHub-Api-Version": "2022-11-28",
                  },
              )
              with urllib.request.urlopen(request, timeout=20) as response:
                  batch = json.load(response)
              commits.extend(batch)
              if len(batch) < 100:
                  break

          if len(commits) != expected_count:
              print(
                  f"GitHub reported {expected_count} pull-request commits, but the DCO check "
                  f"retrieved {len(commits)}. Failing closed.",
                  file=sys.stderr,
              )
              sys.exit(1)

          missing = []
          for commit in commits:
              message = commit["commit"]["message"]
              trailers = terminal_trailers(message)
              if not any(signoff.fullmatch(line.strip()) for line in trailers):
                  missing.append((commit["sha"][:12], message.splitlines()[0]))

          if missing:
              print("The following commits lack a DCO 1.1 Signed-off-by trailer:", file=sys.stderr)
              for sha, subject in missing:
                  print(f"- {sha} {subject}", file=sys.stderr)
              print("Use `git commit --amend -s` and force-push, or sign each commit during rebase.", file=sys.stderr)
              sys.exit(1)

          print(f"DCO sign-off verified for {len(commits)} commit(s).")
          PY
