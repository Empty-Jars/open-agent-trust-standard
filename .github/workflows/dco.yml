name: DCO

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: dco-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  signoff:
    name: DCO sign-off
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify every pull-request commit has a DCO sign-off
        env:
          API_URL: ${{ github.api_url }}
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PULL_REQUEST_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import sys
          import urllib.request

          api_url = os.environ["API_URL"].rstrip("/")
          repository = os.environ["REPOSITORY"]
          pull_number = os.environ["PULL_REQUEST_NUMBER"]
          token = os.environ["GH_TOKEN"]
          signoff = re.compile(r"^Signed-off-by:\s+.+\s+<[^<>]+>$", re.IGNORECASE)
          commits = []

          for page in range(1, 101):
              url = f"{api_url}/repos/{repository}/pulls/{pull_number}/commits?per_page=100&page={page}"
              request = urllib.request.Request(
                  url,
                  headers={
                      "Accept": "application/vnd.github+json",
                      "Authorization": f"Bearer {token}",
                      "X-GitHub-Api-Version": "2022-11-28",
                  },
              )
              with urllib.request.urlopen(request, timeout=20) as response:
                  batch = json.load(response)
              commits.extend(batch)
              if len(batch) < 100:
                  break
          else:
              print("Refusing to evaluate more than 10,000 commits.", file=sys.stderr)
              sys.exit(1)

          if not commits:
              print("No commits were returned for this pull request.", file=sys.stderr)
              sys.exit(1)

          missing = []
          for commit in commits:
              message = commit["commit"]["message"]
              if not any(signoff.match(line.strip()) for line in message.splitlines()):
                  missing.append((commit["sha"][:12], message.splitlines()[0]))

          if missing:
              print("The following commits lack a DCO 1.1 Signed-off-by trailer:", file=sys.stderr)
              for sha, subject in missing:
                  print(f"- {sha} {subject}", file=sys.stderr)
              print("Use `git commit --amend -s` and force-push, or sign each commit during rebase.", file=sys.stderr)
              sys.exit(1)

          print(f"DCO sign-off verified for {len(commits)} commit(s).")
          PY
